trigger:
  branches:
    include:
      - main  # ✅ GitHub 側の main ブランチをトリガーにする

resources:
  repositories:
    - repository: web-ai-chatbot
      type: github
      endpoint: yazaki-tatsuya   # STEP3 で作成した GitHub 接続名
      name: yazaki-tatsuya/web-ai-chatbot  # GitHub のユーザー名/リポジトリ名

pool:
  vmImage: 'ubuntu-latest'

steps:
  - checkout: web-ai-chatbot  # ✅ 上で定義した GitHub リポジトリをチェックアウト

  - script: |
      echo "GitHub から取得したコードの内容をビルドや処理できます"
      ls -la
    displayName: 'Check out GitHub repo and list files'

  - task: UsePythonVersion@0
    inputs:
      versionSpec: '3.11'
      addToPath: true
    displayName: 'Python 3.11 を準備'

  - script: |
      set -euo pipefail
      python -m pip install -r requirements.txt
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: '検証用の依存関係をインストール'

  - script: |
      set -euo pipefail
      python -m py_compile test_OpenAI_WebUI.py session_store.py test_realtime_api.py
    workingDirectory: '$(Build.SourcesDirectory)'
    env:
      PYTHONPYCACHEPREFIX: '$(Agent.TempDirectory)/python-cache'
    displayName: 'Python 構文チェック'

  - script: |
      set -euo pipefail
      python -m unittest -v test_realtime_api.py
    workingDirectory: '$(Build.SourcesDirectory)'
    env:
      FLASK_SECRET_KEY: 'ci-test-only-not-for-production'
      SQLITE_PATH: '$(Agent.TempDirectory)/ci-test.db'
      PYTHONPYCACHEPREFIX: '$(Agent.TempDirectory)/python-cache'
    displayName: 'ユニットテスト（失敗時はデプロイを停止）'

  - task: NodeTool@0
    inputs:
      versionSpec: '24.x'
    displayName: 'Node.js 24 を準備'

  - script: |
      set -euo pipefail
      node --test tests/*.test.cjs
    workingDirectory: '$(Build.SourcesDirectory)'
    displayName: 'JavaScript ユニットテスト（失敗時はデプロイを停止）'

  - task: ArchiveFiles@2
    inputs:
      rootFolderOrFile: '$(Build.SourcesDirectory)'
      includeRootFolder: false
      archiveType: 'zip'
      archiveFile: '$(Build.ArtifactStagingDirectory)/app.zip'
      replaceExistingArchive: true
    displayName: 'ZIPファイル作成'

  - task: AzureWebApp@1
    inputs:
      azureSubscription: 'pipeline_web-ai-chatbot'  # STEP4 で作成した Azure 接続名
      appType: 'webAppLinux'
      appName: 'rainbow-web-ai-chatbot3'
      package: '$(Build.ArtifactStagingDirectory)/app.zip'
    displayName: 'App Service にデプロイ'