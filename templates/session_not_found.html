<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>セッションが見つかりません</title>
</head>
<body class="bg-light">
  <main class="container py-4">
    <div class="card">
      <div class="card-body">
        <h1 class="h4 card-title">セッションが見つかりません</h1>
        <p class="card-text text-muted">
          指定されたセッションは存在しないか、すでに利用できなくなっています。
        </p>
        <p class="small text-muted mb-3">セッションID: {{ session_id }}</p>
        <div class="d-flex flex-wrap gap-2">
          <a class="btn btn-primary" href="{{ url_for('history') }}">履歴を確認する</a>
          <a class="btn btn-outline-secondary" href="{{ url_for('modes') }}">新しい練習を始める</a>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
